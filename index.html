<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumer Number List</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#38bdf8;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  h1{
    font-size:1.4rem;
    margin-bottom:4px;
  }
  .sub{
    color:var(--muted);
    margin-bottom:20px;
    font-size:0.9rem;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  input[type="text"]{
    flex:1;
    min-width:200px;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.95rem;
  }
  button{
    padding:10px 16px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#0f172a;
    font-weight:600;
    cursor:pointer;
    font-size:0.9rem;
  }
  button:hover{opacity:0.9;}
  .count{
    color:var(--muted);
    margin-bottom:10px;
    font-size:0.85rem;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
  }
  th, td{
    padding:10px 14px;
    text-align:left;
    border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  th{
    background:#0b1220;
    color:var(--accent);
    position:sticky;
    top:0;
  }
  tr:hover td{
    background:#243348;
  }
  .num{
    font-family:'Consolas', monospace;
    letter-spacing:0.5px;
  }
  .copy-btn{
    padding:4px 10px;
    font-size:0.75rem;
    background:transparent;
    border:1px solid var(--accent);
    color:var(--accent);
  }
  .copy-btn:hover{
    background:var(--accent);
    color:#0f172a;
  }
  .table-wrap{
    max-height:75vh;
    overflow:auto;
    border-radius:10px;
  }
</style>
</head>
<body>

<h1>Consumer Number List</h1>
<div class="sub">Indexing D.o.T. R-024 &nbsp;|&nbsp; Date: 17.08.26 &nbsp;|&nbsp; 12-digit format: 032 + 9-digit padded number</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search consumer number...">
  <button onclick="downloadCSV()">Download CSV</button>
  <button onclick="copyAll()">Copy All</button>
</div>

<div class="count" id="count"></div>

<div class="table-wrap">
<table>
  <thead>
    <tr><th style="width:60px;">#</th><th>Original</th><th>Consumer Number (12-digit)</th><th style="width:80px;">Copy</th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>

<script>
// Original numbers as read from the handwritten register
const rawNumbers = [
  "107018","10149021","81333","81031","10148984","94156","10765782","81355","81356",
  "98219","81033","98220","99124","107314","98184","98461","109694","10745852","81042",
  "10754169","111602","98185","81290","94929","94184","99012","98214","81291","10165640",
  "10148977","81275","81279","81917",
  "10747668","81049","110475","94158","81185","81183","10754147","81184","108112",
  "107017","10160896","10763422","81261","98196","111537","111549","81257","81258",
  "111648","81247","81357","91400","10754157","98177","10750253","81053","81023",
  "93529","111636","84600","10765659","10145090","81040",
  "81039","129450","95893","81278","81276","111463","94587","130057","94169","111598",
  "81288","1074898","91429","116262","81332","10754190","91430","107367","10756970",
  "98186","98187","122308","10756969","10154183","81287","91410","10746112","10148979",
  "81176","129680","98145","81364","98220"
];

function toConsumerNumber(n){
  return "032" + n.padStart(9,"0");
}

const data = rawNumbers.map(n => ({ original:n, consumer: toConsumerNumber(n) }));

const tbody = document.getElementById("tbody");
const countEl = document.getElementById("count");

function render(list){
  tbody.innerHTML = "";
  list.forEach((row, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="num">${row.original}</td>
      <td class="num">${row.consumer}</td>
      <td><button class="copy-btn" onclick="copyOne('${row.consumer}')">Copy</button></td>
    `;
    tbody.appendChild(tr);
  });
  countEl.textContent = `Total: ${list.length} consumer numbers`;
}

function copyOne(text){
  navigator.clipboard.writeText(text);
}

function copyAll(){
  const text = data.map(d => d.consumer).join("\n");
  navigator.clipboard.writeText(text);
  alert("All consumer numbers copied to clipboard!");
}

function downloadCSV(){
  let csv = "S.No,Original,Consumer Number\n";
  data.forEach((d,i) => {
    csv += `${i+1},${d.original},${d.consumer}\n`;
  });
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "consumer_numbers.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  if(!q){ render(data); return; }
  const filtered = data.filter(d => d.original.includes(q) || d.consumer.includes(q));
  render(filtered);
});

render(data);
</script>

</body>
</html>
